# Grok-owned setup handoff; not applied by the plugin. Startup policy requires
# the selected sandbox to be started with these fields, not only saved updates.
version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/bin, /usr, /lib, /lib64, /etc, /proc, /dev/urandom]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: hard_requirement
network_policies: {}
