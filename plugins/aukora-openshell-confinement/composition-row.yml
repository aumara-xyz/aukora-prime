# Handoff only: Grok owns shared composition and materializer registration.
# R2: keep disabled until the root-owned wrapper stream/policy interface and
# actual guest Node/built-bootstrap paths are joined and accepted by Grok.
# Grok's shared Linux rows must disable sandbox, aukora-seatbelt, bash-sandbox
# and any bash-local provider, enable the selected preset's one-shot tool-bash,
# and set that actual preset row's config
# enableRunInBackground: false. This plugin supplies the sole shell provider.
# sandbox-policy: mode workspace-write, workspaceRoot /sandbox.
# Web disables its host tool-bash row; enabling that host row alone does not
# establish the selected preset's tool config. Do not select minimal's bash.
# The calling session's immutable cwd must be /sandbox or the explicitly declared
# exact hostWorkspaceRoot (Grok's L1-a mapping). No host workspace mount is requested.
# The base/standard one-shot tool-bash row is the supported 'bash' alias.
# Minimal's persistent-bash row (dsh-tool-bash-persistent) also calls itself
# 'bash'; it is unsupported. Package names and row ids are not interchangeable.
# R2 mounts the existing guest subprocess interface in a named Cordis realm.
# KEEP the base subprocess-local row and tool-fs-search in the native root realm.
# Tag this provider and existing ptc-runtime, SINGLE agent-loop, and enabled
# terminal-bash backend/group with isolate: { subprocess: aukora-model-exec }.
# A string joins that named realm; true would create separate realms and break
# the join. Exactly one provider writes it. The agent-loop tag is necessary for
# browser terminal's agent.ctx lookup. Preserve any existing terminals isolation.
# Do not isolate ptcRuntime or shell: host consumers must find those services.
# An empty guest realm must not inherit native subprocess. No argv-based host fallback.
# Node PTC must use the actual configured guest
# nodeExecutable and bootstrapPath; the default host identity mapping is invalid.
# Enable the selected existing Node PTC, Bash terminal and browser terminal rows
# only after actual guest FD7/PTY/cleanup acceptance. PowerShell remains unsupported.
# Disable aukora-caged-worker on Linux and apply its separate early-refusal
# handoff; that fixed workspace-patch alias uses the macOS box launch path.
# Retain the existing mandatory-agent-confinement patch. Do NOT apply historical
# handoff/linux-unsupported-consumers.patch.json to R2: it intentionally refused
# the routes this implementation now carries. Actual nodeExecutable/bootstrapPath
# values must be supplied by Grok; this disabled source row does not infer them.
- insert:
    - id: aukora-openshell-confinement
      name: ./plugins/aukora-openshell-confinement/lib/index.mjs
      disabled: true
      isolate:
        subprocess: aukora-model-exec
      config:
        workspaceRoot: /sandbox
        timeoutSeconds: 60
