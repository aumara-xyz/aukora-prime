      el.appendChild(row('sentinel', r.sentinel_verdict, r.sentinel_verdict === 'SUSPICIOUS' ? 'warn' : 'good'));
      el.appendChild(row('position source', r.position_source));
      for (const a of r.anomalies || []) el.appendChild(h('div', 'note warn', a));

      el.appendChild(h('h2', '', 'What was sensed'));
      const s = r.senses || {};
      el.appendChild(row('light', s.optical || 'PERFORMED'));
      el.appendChild(row('sound', 'acoustic_channel: ' + r.acoustic_channel + (s.acoustic && s.acoustic !== r.acoustic_channel ? ' (' + s.acoustic + ')' : ''), r.acoustic_channel === 'ECHO_CONFIRMED' ? 'good' : ''));
      if (r.acoustic_channel === 'ECHO_CONFIRMED') el.appendChild(h('div', 'note', 'This device played a random code as sound only. The other device sent that code back inside a signed frame, so its microphone heard this speaker. It was not timed.'));
      const dg = (r.sound_echo || {}).diag;
      if (dg) el.appendChild(row('sound detail', 'sent ' + dg.bursts_sent + ' (' + dg.last_band_sent + ') · heard ' + (dg.heard_band || 'nothing') + ' · tone peak ' + dg.tone_peak_db_high + ' / ' + dg.tone_peak_db_low + ' dB · ' + dg.mic + ' · audio ' + dg.audio + ' @' + dg.sample_rate));
      const mo = r.motion || {};
      el.appendChild(row('motion', (mo.result || 'NOT_PERFORMED') + (mo.quarter_seconds_compared ? ' (' + mo.both + ' of ' + mo.quarter_seconds_compared + ' quarter-seconds)' : ''), mo.result === 'SEEN_AND_CLAIMED' ? 'good' : ''));
      if (mo.result === 'SEEN_AND_CLAIMED') el.appendChild(h('div', 'note', 'The other device said, in its signed frames, that it was moving. In those same moments this camera saw its code move, while this device was not moving itself. The first part is the other device’s own claim.'));
      el.appendChild(row('chord', s.chord || 'UNKNOWN'));
      el.appendChild(row('vibration', s.haptic || 'UNKNOWN'));
      el.appendChild(row('place A', fmtGeo(r.geo_A) + (r.geo_A ? ' · claimed, unsigned' : '')));
      el.appendChild(row('place B', fmtGeo(r.geo_B) + (r.geo_B ? ' · claimed, unsigned' : '')));
      el.appendChild(row('time', new Date(r.t_B * 1000).toISOString().replace('.000Z', 'Z') + ' · window ' + (r.t_B - r.t_A) + ' s'));
      if (typeof s.ack_round_trip_ms === 'number') el.appendChild(row('reply round trip', s.ack_round_trip_ms + ' ms · claimed'));
      el.appendChild(row('peer confirmed', r.peer_bloom_seen === false ? 'NOT SEEN — the other device may not hold this receipt' : 'seen'));

      el.appendChild(h('h2', '', 'What is signed'));
      el.appendChild(h('div', 'note', 'Both keys signed one hash of: ' + (r.signed_fields || P.SIGNED_FIELDS).join(', ') + '. Every other field on this receipt is an unsigned claim made by this device.'));
      el.appendChild(row('key A', r.pk_A.slice(2, 18) + '…'));
      el.appendChild(row('key B', r.pk_B.slice(2, 18) + '…'));
      el.appendChild(row('this copy', 'minted by ' + (r.minted_by || '?')));
      if (r.intent) {
        el.appendChild(row('approves', r.intent.text));
        el.appendChild(row('other device signed the words', r.intent.ack ? 'yes' : 'no', r.intent.ack ? 'good' : 'warn'));
        el.appendChild(h('div', 'note', 'This page\u2019s session nonce is a commitment to that text, and the nonce is inside the hash both keys signed. ' + (r.intent.ack ? 'The other device showed the same text, its person tapped approve, and its key signed the text for this session.' : 'The other device signed the moment, not the words.')));
      }
      if (r.approved) {
        el.appendChild(row('you approved', r.approved.text));
        el.appendChild(h('div', 'note', 'Asked by key ' + r.approved.asker.slice(2, 14) + '. This device showed the text, you tapped approve, and this device\u2019s key signed it for this one session.'));
      }

      el.appendChild(h('h2', '', 'What this does not prove'));
      el.appendChild(h('div', 'note', P.DOES_NOT_PROVE_LEAD));
      const ol = h('ol', 'dnp');
      for (const line of P.DOES_NOT_PROVE) ol.appendChild(h('li', '', line));
      el.appendChild(ol);
      el.appendChild(h('div', 'note', 'The pattern is a picture of the signed hash. It carries no security claim of its own.'));

      const done = attempts.filter((a) => a.outcome === 'BLOOM');
      const med = median(done.map((a) => a.lock_to_end_ms));
      el.appendChild(h('h2', '', 'This session'));
      el.appendChild(row('page', P.VERSION));
      el.appendChild(row('attempts', attempts.length + ' · bloomed ' + done.length + (med === null ? '' : ' · median lock→bloom ' + med + ' ms')));

      const acts = h('div', 'acts');
      const cp = action('copy receipt', () => copyText(JSON.stringify(r, null, 2), cp));
      acts.appendChild(cp);
      acts.appendChild(action('save receipt', () => saveFile('copresence-receipt-' + r.digest + '.json', JSON.stringify(r, null, 2))));
      acts.appendChild(action('save test log', async () => saveFile('copresence-export-' + Date.now() + '.json', JSON.stringify(await exportAll(), null, 2))));
      acts.appendChild(action('close', closeSheet));
      el.appendChild(acts);
    });
  }

  function openPublish(r) {
    openSheet((el) => {
      let cls = 'coarse', signed = null;
      el.appendChild(h('div', 'big', r.digest.slice(0, 4) + ' ' + r.digest.slice(4)));
      el.appendChild(h('h2', '', 'Publish this receipt'));
      el.appendChild(h('div', 'note', 'Nothing leaves this device unless you tap publish. Publishing sends this one receipt to public Nostr relays, once. It cannot be withdrawn.'));
      const sent = h('div', 'note warn');
      const showSent = () => { sent.textContent = r.published_at && r.published_at.length ? 'This device already sent this receipt to relays: ' + r.published_at.join(', ') + '.' : ''; };
      el.appendChild(sent); showSent();
      const opts = h('div', 'opts');
      const preview = h('div', 'note');
      const show = () => {
        const p = P.receiptForPublish(r, cls);
        preview.textContent = 'Location sent: ' + (p.geo_A || p.geo_B ? [p.geo_A, p.geo_B].filter(Boolean).map((g) => g.lat + ', ' + g.lon).join(' | ') : 'none');
      };
      for (const [val, label] of [['coarse', 'Coarse location, about 100 m (default)'], ['redacted', 'No location'], ['exact', 'Exact location']]) {
        const lab = h('label', 'opt');
        const inp = document.createElement('input');
        inp.type = 'radio'; inp.name = 'geo'; inp.value = val; inp.checked = val === cls;
        inp.addEventListener('change', () => { cls = val; signed = null; show(); });
        lab.appendChild(inp); lab.appendChild(h('span', '', label));
        opts.appendChild(lab);
      }
      el.appendChild(opts); el.appendChild(preview); show();
      const signer = window.nostr && window.nostr.signEvent ? 'nip07' : P.hasSigner ? 'onetime' : 'none';
      el.appendChild(h('div', 'note', signer === 'nip07' ? 'It will be signed by your Nostr signer.'
        : signer === 'onetime' ? 'It will be signed with a one-time Nostr key made for this publish and then discarded. The two device signatures are inside the receipt.'
          : 'This build has no Nostr signer, so it can only copy the unsigned event.'));
      const status = h('div', 'status');
      const build = async () => {
        let ev = P.buildNostrEvent(r, cls, '', Math.floor(Date.now() / 1000));
        if (signer === 'nip07') { ev.pubkey = await window.nostr.getPublicKey(); ev = await window.nostr.signEvent(ev); }
        else if (signer === 'onetime') { const sk = crypto.getRandomValues(new Uint8Array(32)); ev = await P.signNostrEvent(ev, sk); sk.fill(0); }
        return ev;
      };
      const acts = h('div', 'acts');
      if (signer !== 'none') {
        const pub = action('publish', async (e) => {
          if (!NET.arm(e)) return; // only a real tap opens the network, and only for this publish
          pub.disabled = true;
          while (status.firstChild) status.removeChild(status.firstChild);
          let ev = signed;
          signed = null;
          if (!ev) {
            try { ev = await build(); } catch (x) { status.appendChild(h('div', 'warn', 'not signed: ' + (x && x.message))); NET.disarm(); pub.disabled = false; return; }
          }
          if (!NET.isArmed()) { // an external signer took longer than the tap stays armed: keep the signed event, ask for a fresh tap
            signed = ev;
            status.appendChild(h('div', 'note', 'Signed. Nothing was sent. Tap publish again to send it.'));
            pub.disabled = false;
            return;
          }
          tele('PUBLISH_START', cls + ' ' + ev.id.slice(0, 12));
          let pending = RELAYS.length, accepted = 0;
          const settle = () => {
            if (--pending > 0) return;
            NET.disarm(); pub.disabled = false; tele('PUBLISH_END', 'accepted=' + accepted);
            if (accepted) { r.published_at = (r.published_at || []).concat(new Date().toISOString()); dbPut('receipts', r.id, r); showSent(); }
          };
          for (const url of RELAYS) {
            const line = row(url.replace('wss://', ''), '');
            status.appendChild(line);
            let closed = false, ws = null, timer = 0;
            const end = (text, good) => {
              if (closed) return;
              closed = true; clearTimeout(timer);
              if (good) accepted++;
              line.lastChild.textContent = text; line.lastChild.className = 'v ' + (good ? 'good' : 'warn');
              try { if (ws) ws.close(); } catch (x) { /* closed */ }
              settle();
            };
            try { ws = NET.openSocket(url); } catch (x) { end('not opened', false); continue; }
            timer = setTimeout(() => end('no answer', false), 7000);
            ws.onopen = () => { try { ws.send(JSON.stringify(['EVENT', ev])); } catch (x) { end('send failed', false); } };
            ws.onmessage = (m) => {
              try {
                const d = JSON.parse(m.data);
                if (Array.isArray(d) && d[0] === 'OK' && d[1] === ev.id) end(d[2] === true ? 'accepted' : 'rejected: ' + String(d[3] || '').slice(0, 120), d[2] === true);
              } catch (x) { /* not ours */ }
            };
            ws.onerror = () => end('connection failed', false);
            ws.onclose = () => end('closed without an answer', false);
          }
        });
        acts.appendChild(pub);
      }
      const cp = action('copy event', async () => { try { copyText(JSON.stringify(await build(), null, 2), cp); } catch (x) { cp.textContent = 'not signed'; } });
      acts.appendChild(cp);
      acts.appendChild(action('close', closeSheet));
      el.appendChild(acts);
      el.appendChild(status);
    }, true);
  }

  // ------------------------------------------------------------ boot: FACE first, everything else arrives when it arrives
  async function wakeLock() { try { if (navigator.wakeLock && !document.hidden) await navigator.wakeLock.request('screen'); } catch (e) { /* optional */ } }

  async function boot() {
    tele('BOOT', P.VERSION + (window.isSecureContext ? '' : ' INSECURE_CONTEXT'));
    layout();
    requestAnimationFrame(draw);
    startGeo();
    audio.init();
    initDecoders();
    db = await idbOpen();
    if (!db) tele('IDB_UNAVAILABLE');
    try {
      keys = await dbGet('keys', 'device');
      // A stored key that reads back but cannot sign is replaced; the face changes, nothing else is lost.
      if (keys && keys.privateKey && keys.pk) {
        let works = false;
        try { const m = P.utf8('copresence.selftest'); works = await P.verifyBytes(keys.pk, m, await P.signBytes(keys.privateKey, m)); } catch (e) { works = false; }
        if (!works) { tele('KEY_UNREADABLE'); keys = null; }
      }
      if (!keys || !keys.privateKey || !keys.pk) {
        const kp = await P.generateKeyPair();
        keys = { privateKey: kp.privateKey, pk: kp.pk };
        await dbPut('keys', 'device', keys);
      }
    } catch (e) { tele('CRYPTO_UNAVAILABLE', String(e && e.message)); return; }
    tele('IDB_KEY_READY', keys.pk.slice(2, 14));
    if (intent) { await intent.fill(); askEl.textContent = intent.pieces ? 'approve: ' + intent.text : 'this text is too long to approve'; askEl.className = 'on'; tele('APPROVAL_MODE', intent.digest.slice(0, 12)); }
    dev = P.createDevice({ privateKey: keys.privateKey, pk: keys.pk, now: () => Math.floor(Date.now() / 1000), geo: () => (geo && geo.acc <= 6553.5 ? geo : null),
      senses: () => ({ cap: audio.caps() | (motion.sensing() ? 4 : 0), snd: audio.heardHex() || undefined, mov: motion.bits() }),
      nonce: intent ? intent.next : undefined,
      ask: intent ? () => intent.pieces : undefined,
      ack: () => (approval && approval.state === 'approved' && performance.now() - approval.at <= APPROVAL_TTL_MS ? { digest: approval.digest, asker: approval.pk } : null),
    });
    faceDigits = await P.pentoraDigits(await P.faceHead(keys.pk));
    await audio.prepare();
    await refreshFrame();
    loadHistory();
    wakeLock();
    startCamera();
  }

  bindPress(canvas, () => ((visual === 'BLOOMING' || visual === 'SETTLED') ? receipt : null));
  document.addEventListener('pointerup', () => { audio.unlock(); }, true);
  for (const type of ['touchend', 'click']) document.addEventListener(type, () => { audio.unlock(); motion.request(); }, true);
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', layout);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { stopCamera(true); if (visual === 'FACE') setPhase('init'); }
    else { wakeLock(); startCamera(); }
  });
  boot().catch((e) => tele('BOOT_ERROR', String(e && e.message)));
})();
</script>
</body>
</html>
