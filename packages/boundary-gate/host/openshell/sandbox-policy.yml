# STARTUP policy of sandbox auma-ws (install root:root 0644 beside ensure-sandbox.sh). Filesystem and Landlock fields are
# startup-only: ensure-sandbox.sh refuses a sandbox that does not report exactly this policy. A qualified producer
# must mount the registered workspace and kernel read-only .git before Landlock sees the final hierarchy. The five
# writable roots stay exact; adding .git here would not remove write access granted to its /sandbox parent.
version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/bin, /usr, /lib, /lib64, /etc, /proc, /dev/urandom]
  read_write: [/sandbox, /tmp, /dev/null, /dev/pts, /dev/ptmx]
landlock:
  compatibility: hard_requirement
network_policies: {}
