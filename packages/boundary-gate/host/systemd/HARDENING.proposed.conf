# BEGIN packages/boundary-gate/host/systemd/aukora-boundary-gate.service
# Exec: gate-bootstrap serve -> protected Node gate.mjs; reads /etc/aukora-boundary-gate, /opt/aukora-boundary-gate and runtime pins.
# Reads /opt/aukora-genesis/release-*/.dsh-build records and /etc/aukora-approvals/release-floor.json for the always-enabled plugin-set target.
# Writes /home/aukora-gate/{gate.db*,owner-secret.json,receipt-ed25519.pem}, /run/aukora-gate/{gate.sock,owner.sock,receipt-ed25519.pub} and /var/lib/aukora-boundary/targets/plugins/{auma-theme/theme.json,aukora-plugin-set/approval.json}.
# The current argv has no --owner-page, so HTTP is disabled. Keep AF_INET/AF_INET6 for the documented optional loopback owner page.
# Existing UMask=0027 preserves shared skgate reads; socket and target modes are explicitly 0660/0640. MemoryDenyWriteExecute needs a run on staging with Node JIT and is omitted.
[Service]
# Executable/configuration trees are read-only; all gate writes are enumerated below.
ProtectSystem=strict
# The gate reads its existing home; only the owned gate home is reopened for writes.
ProtectHome=read-only
# SQLite WAL, key/secret rotation, sockets and approved target renames remain writable.
ReadWritePaths=/home/aukora-gate /run/aukora-gate /var/lib/aukora-boundary/targets
# Gate RPC uses Unix sockets and the optional owner HTTP page uses loopback TCP.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
# The service and its children do not acquire another UID or elevated executable privileges.
NoNewPrivileges=yes
# No configured IPC endpoint or durable state uses host /tmp or /var/tmp.
PrivateTmp=yes
# Only ordinary pseudo-devices are needed; no source path opens host block, GPU, fuse or tun devices.
PrivateDevices=yes
# The service reads process/kernel information but does not write kernel tunables.
ProtectKernelTunables=yes
# The service does not load or unload kernel modules.
ProtectKernelModules=yes
# Logs go to the journal or service files; kernel log access is unused.
ProtectKernelLogs=yes
# The service does not create or modify cgroups.
ProtectControlGroups=yes
# The service and its children do not create or join namespaces.
RestrictNamespaces=yes
# All declared executables use their native process ABI.
LockPersonality=yes
# No declared operation mounts filesystems, reboots, swaps memory, loads modules or performs raw I/O.
SystemCallFilter=~@mount @reboot @swap @module @raw-io
# The service uses its own files and unprivileged sockets; no kernel capabilities are required.
CapabilityBoundingSet=
# END packages/boundary-gate/host/systemd/aukora-boundary-gate.service

