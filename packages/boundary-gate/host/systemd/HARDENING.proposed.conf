# Proposed per-unit drop-ins; no block is installed by this file.
# Extract exactly one BEGIN/END block into the named unit's .d/ directory.
# Source review only: staging must qualify startup, positive work, refusals, restart and stop.
# ReadWritePaths assumes installer-created directories; it grants no Unix permissions.
# Node uses V8 JIT: MemoryDenyWriteExecute is omitted, not worked around with --jitless.
# A timer schedules its service; process restrictions belong on that service.

# BEGIN packages/boundary-gate/host/systemd/aukora-auma-podman.service
# Exec: openshell/podman-service.sh -> podman system service; reads /etc/{subuid,subgid,containers} and /home/auma container configuration.
# Writes /home/auma/.local/share/containers and /run/user/<auma uid>/podman/podman.sock; uses /run/user/<uid>/bus, container cgroups, /var/tmp image storage and driver-dependent /dev/fuse or /dev/net/tun.
# Podman API serves AF_UNIX; container pulls/networks can also need AF_INET, AF_INET6 and AF_NETLINK.
# Needs a run on staging: ProtectSystem=strict/ReadWritePaths, ProtectHome, PrivateTmp, PrivateDevices, ProtectKernel*, ProtectControlGroups and network-family restrictions depend on actual storage, device, mount, cgroup and network drivers.
# Omit NoNewPrivileges, RestrictNamespaces, LockPersonality, SystemCallFilter and MemoryDenyWriteExecute: seccomp/implied NNP or lost namespaces can break newuidmap/newgidmap and Podman; do not clear capabilities.
[Service]
# New private state and transient files need no group or world access; explicit shared modes remain authoritative.
UMask=0077
# No source path loads modules, accesses raw devices, sets host time, reads kernel logs or blocks suspend; retain UID/GID and container capabilities.
CapabilityBoundingSet=~CAP_SYS_MODULE CAP_SYS_RAWIO CAP_SYS_TIME CAP_SYSLOG CAP_WAKE_ALARM
# END packages/boundary-gate/host/systemd/aukora-auma-podman.service

