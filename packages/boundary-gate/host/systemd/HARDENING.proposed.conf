# BEGIN host/aura-interim/aukora-aura-collector.service
# ExecStartPre=+ Node snapshot.mjs reads /home/aukora-gate/gate.db and writes /var/lib/aukora-aura/snapshot/gate.db; root chowns its private temporary snapshot.
# ExecStart reads /etc/aukora-aura/{context.mjs,public.json,gate-receipt-ed25519.pub,author-INTERIM.key,anchors.json,gate-key.sha256}, release collector code under /opt/aukora-genesis/release-* and the snapshot; writes /var/lib/aukora-aura/store.
# Existing strict/read-only-home/private-temp/private-network restrictions and ReadWritePaths=/var/lib/aukora-aura are retained. The + snapshot prefix exempts its root process from per-command sandbox restrictions; this proposal does not confine that helper.
# No capability reduction is proposed for the root snapshot: DAC read and chown needs must be qualified on staging. MemoryDenyWriteExecute omitted for Node JIT.
[Service]
# The snapshot/collector reads SQLite files and uses no host devices.
PrivateDevices=yes
# Neither snapshot nor collector loads modules.
ProtectKernelModules=yes
# Collection reads the gate database, not kernel logs.
ProtectKernelLogs=yes
# The collector is offline; SQLite and local subprocesses need no IP sockets.
RestrictAddressFamilies=AF_UNIX
# Snapshot, collector and Python verifier do not create namespaces.
RestrictNamespaces=yes
# Node/Python use the native ABI.
LockPersonality=yes
# Collection and snapshotting need file/database I/O, not system administration calls.
SystemCallFilter=~@mount @reboot @swap @module @raw-io
# END host/aura-interim/aukora-aura-collector.service

# BEGIN host/aura-interim/aukora-aura-collector.timer
# Timer only: schedules the collector; no process sandbox applies to this unit.
[Timer]
# END host/aura-interim/aukora-aura-collector.timer

# BEGIN host/prime-mirror/aukora-prime-mirror.service
# Exec: /usr/local/sbin/aukora-prime-mirror -> git, timeout, tar, install, chown, chmod, find, mv, rm; fetches https://github.com/aumara-xyz/aukora-prime.git or reads /var/lib/aukora-prime-mirror/main.bundle.
# Writes bare repo /var/lib/aukora-prime-mirror/prime.git, staging/renamed trees under /srv/auma-mirror, and /srv/auma-ws/aukora-prime/.git/info/exclude; these three parent directories must exist before enabling strict mode.
# Keep host home visibility until staging establishes Git credential/CA/helper configuration; this source uses HTTPS, but installed Git configuration is not pinned.
# MemoryDenyWriteExecute, RestrictNamespaces and SystemCallFilter need a run on staging with the configured Git transport/credential helpers; omitted.
[Service]
# The mirror script uses group-readable archives for auma-ws and already selects umask 027.
UMask=0027
# Git checkout and inode swaps write only the three specified locations.
ProtectSystem=strict
# Bare fetch, atomic mirror replacement and excludes remain writable.
ReadWritePaths=/var/lib/aukora-prime-mirror /srv/auma-mirror /srv/auma-ws/aukora-prime/.git/info
# Git uses HTTPS/DNS and may use a local credential helper.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
# Root assigns auma-ws ownership, preserves chmod 2750 setgid directories and updates protected mirror/workspace metadata.
CapabilityBoundingSet=CAP_CHOWN CAP_FOWNER CAP_FSETID CAP_DAC_OVERRIDE
# The service and its children do not acquire another UID or elevated executable privileges.
NoNewPrivileges=yes
# No configured IPC endpoint or durable state uses host /tmp or /var/tmp.
PrivateTmp=yes
# Only ordinary pseudo-devices are needed; no source path opens host block, GPU, fuse or tun devices.
PrivateDevices=yes
# The service reads process/kernel information but does not write kernel tunables.
ProtectKernelTunables=yes
# The service does not load or unload kernel modules.
ProtectKernelModules=yes
# Logs go to the journal or service files; kernel log access is unused.
ProtectKernelLogs=yes
# The service does not create or modify cgroups.
ProtectControlGroups=yes
# All declared executables use their native process ABI.
LockPersonality=yes
# END host/prime-mirror/aukora-prime-mirror.service

# BEGIN host/prime-mirror/aukora-prime-mirror.timer
