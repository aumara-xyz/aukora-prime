[Service]
# The supervisor explicitly launches CPU inference with --n-gpu-layers 0; no GPU, fuse or tun device is used.
PrivateDevices=yes
# The supervisor only reads /proc for memory and listener ownership.
ProtectKernelTunables=yes
# Python and the pinned CPU embedder do not load kernel modules.
ProtectKernelModules=yes
# Service logs use the journal and embed.log, not kernel logs.
ProtectKernelLogs=yes
# The supervisor bounds/kills its own process groups without modifying cgroups.
ProtectControlGroups=yes
# Memory APIs and embedder health/readiness use loopback HTTP and ordinary local IPC.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
# The supervisor launches ordinary child processes and never creates namespaces.
RestrictNamespaces=yes
# The Python server and pinned CPU binary use the native ABI.
LockPersonality=yes
# Both children use the service UID and unprivileged loopback ports.
CapabilityBoundingSet=
# CPU inference, model mmap and ordinary subprocesses need none of these administration calls.
SystemCallFilter=~@mount @reboot @swap @module @raw-io
# END ops/systemd/aukora-openviking.service.in

# BEGIN ops/systemd/aukora-host.service.in
# Exec: @SOURCE_ROOT@/scripts/linux/host-runtime.py -> become-linux.mjs --verify-start -> launch-dsh.py -> @NODE_PATH@ harness.
# Reads /etc/aukora-host/host.json, /etc/aukora/owner-daemon.json and its configured peer helper/socket, /opt/aukora/releases, root-protected @SOURCE_ROOT@, runtime pins and /var/lib/aukora-host-control/approvals; writes /var/lib/aukora-host/{state,overlay/support data}, listens loopback 18735 and reaches providers.
# The existing template has NoNewPrivileges=true/ProtectHome=true/ProtectSystem=strict. These do not establish that its harness can use the legacy sudo-to-auma sbx-exec chain; that route would fail under NNP.
# Needs a run on staging: qualify the actual harness executor and all writable mounts before installing this template. Do not copy the generic hardening directives onto aukora-genesis.service.
# Needs a run on staging: ProtectSystem=strict/ReadWritePaths, ProtectHome, PrivateTmp, PrivateDevices, ProtectKernel*, ProtectControlGroups and network-family restrictions depend on actual storage, device, mount, cgroup and network drivers.
# Omit NoNewPrivileges, RestrictNamespaces, LockPersonality, SystemCallFilter and MemoryDenyWriteExecute: seccomp/implied NNP or lost namespaces can break newuidmap/newgidmap and Podman; do not clear capabilities.
[Service]
# No source path loads modules, accesses raw devices, sets host time, reads kernel logs or blocks suspend; retain UID/GID and container capabilities.
CapabilityBoundingSet=~CAP_SYS_MODULE CAP_SYS_RAWIO CAP_SYS_TIME CAP_SYSLOG CAP_WAKE_ALARM
# END ops/systemd/aukora-host.service.in

# BEGIN ops/systemd/aukora-become@.service.in
# Exec: @NODE_PATH@ @SOURCE_ROOT@/scripts/aukora/become-linux.mjs -> git/id/flock/systemctl and Node verifiers; switches existing approved releases without building or provisioning.
# Reads /etc/aukora-host/host.json, /etc/aukora/owner-daemon.json with configured peer helper/socket, @SOURCE_ROOT@, /opt/aukora/releases, approvals and /var/lib/aukora-host/state/launch*.json; writes only /var/lib/aukora-host-control/{transition.lock,transition.json,deployment.json} and their temporary files.
# Uses /run/systemd/private, configured owner AF_UNIX socket, loopback 18735 HTTP and /proc/<pid>/{exe,status,cmdline,cgroup}; retain proc visibility.
# Existing strict/ProtectHome/private-temp/NNP/UMask are retained. Clearing capabilities would break fchown and cross-UID private files/proc readback; narrower CAP_CHOWN/DAC/PTRACE needs a run on staging.
# MemoryDenyWriteExecute omitted for V8 JIT; SystemCallFilter and RestrictNamespaces need a run on staging with the configured peer helper.
[Service]
# Transition/readiness uses files, procfs and sockets, not host devices.
PrivateDevices=yes
# Readiness reads proc metadata and does not change sysctls.
ProtectKernelTunables=yes
# The transition controller does not load modules.
ProtectKernelModules=yes
# Its evidence reads proc and HTTP, not kernel logs.
ProtectKernelLogs=yes
# systemctl asks the external manager to change services; this process only reads cgroup identity.
ProtectControlGroups=yes
# Owner/service-manager IPC and local HTTP are the controller network operations.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
# Node and the declared native utilities use the normal ABI.
LockPersonality=yes
# No source path loads modules, accesses raw devices, sets host time, reads kernel logs or blocks suspend; retain UID/GID and container capabilities.
CapabilityBoundingSet=~CAP_SYS_MODULE CAP_SYS_RAWIO CAP_SYS_TIME CAP_SYSLOG CAP_WAKE_ALARM
# END ops/systemd/aukora-become@.service.in

# BEGIN ops/systemd/aukora-viking-door.service.in
# Exec: @NODE_PATH@ @SOURCE_ROOT@/scripts/kira/viking-door.mjs; reads /var/lib/aukora-host/kira-deployment-overlay.patch.yml, the configured state identity/bridge and @EXISTING_PRIVATE_DOOR_KEY_FILE@.
# Writes remembered objects, Aura chain and journal inside the configured stateDir under /var/lib/aukora-host; listens 127.0.0.1:8766 and forwards to the configured local OpenViking HTTP endpoint.
# Keep existing strict/ProtectHome/PrivateTmp/NNP and ReadWritePaths=/var/lib/aukora-host. Staging must check that overlay stateDir, bridge and existing key path are visible; narrower writes require that installed configuration.
# MemoryDenyWriteExecute omitted for V8 JIT.
[Service]
# The door serves loopback HTTP and uses the configured memory HTTP client.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
# Only ordinary pseudo-devices are needed; no source path opens host block, GPU, fuse or tun devices.
PrivateDevices=yes
# The service reads process/kernel information but does not write kernel tunables.
ProtectKernelTunables=yes
# The service does not load or unload kernel modules.
ProtectKernelModules=yes
# Logs go to the journal or service files; kernel log access is unused.
ProtectKernelLogs=yes
# The service does not create or modify cgroups.
ProtectControlGroups=yes
# The service and its children do not create or join namespaces.
RestrictNamespaces=yes
# All declared executables use their native process ABI.
LockPersonality=yes
# No declared operation mounts filesystems, reboots, swaps memory, loads modules or performs raw I/O.
SystemCallFilter=~@mount @reboot @swap @module @raw-io
# The service uses its own files and unprivileged sockets; no kernel capabilities are required.
CapabilityBoundingSet=
# END ops/systemd/aukora-viking-door.service.in

# BEGIN ops/buzz-relay/aukora-buzz.service
# Exec: /usr/local/lib/aukora-buzz/{up,down,read-setting}.sh -> Podman/curl/bash; reads /var/lib/aukora-buzz/{node,image,relay,relay-secrets}.env and secrets/{postgres-password,redis.conf}.
# Writes /var/lib/aukora-buzz/{data/postgres,data/redis,data/git,.local/share/containers}, /run/user/<buzz uid> and driver-dependent /var/tmp downloads; data/git :U relabels subordinate ownership.
# Uses user-manager bus, Podman sockets, loopback published relay port, registry HTTPS/DNS, AF_NETLINK and driver-dependent /dev/fuse or /dev/net/tun.
# Needs a run on staging: ProtectSystem=strict/ReadWritePaths, ProtectHome, PrivateTmp, PrivateDevices, ProtectKernel*, ProtectControlGroups and network-family restrictions depend on actual storage, device, mount, cgroup and network drivers.
# Omit NoNewPrivileges, RestrictNamespaces, LockPersonality, SystemCallFilter and MemoryDenyWriteExecute: seccomp/implied NNP or lost namespaces can break newuidmap/newgidmap and Podman; do not clear capabilities.
[Service]
# New private state and transient files need no group or world access; explicit shared modes remain authoritative.
UMask=0077
# No source path loads modules, accesses raw devices, sets host time, reads kernel logs or blocks suspend; retain UID/GID and container capabilities.
CapabilityBoundingSet=~CAP_SYS_MODULE CAP_SYS_RAWIO CAP_SYS_TIME CAP_SYSLOG CAP_WAKE_ALARM
# END ops/buzz-relay/aukora-buzz.service

# BEGIN ops/buzz-relay/aukora-buzz-watch.service
# Exec: root /usr/local/lib/aukora-buzz/check.sh --watch -> systemctl, sudo -u aukora-buzz Podman, curl and read-setting.sh.
# Reads /var/lib/aukora-buzz/node.env, container state and health; sudo/Podman may write /run/sudo, configured /var/log/sudo, /var/lib/aukora-buzz/.local/share/containers and /run/user/<buzz uid>.
# Uses /run/systemd/private to restart the separate pod service and loopback health; preserve CAP_SETUID/CAP_SETGID and Podman namespaces. A restart asks PID 1 to start a separate unit, so watcher restrictions are not pod containment.
# Needs a run on staging: ProtectSystem=strict/ReadWritePaths, ProtectHome, PrivateTmp, PrivateDevices, ProtectKernel*, ProtectControlGroups and network-family restrictions depend on actual storage, device, mount, cgroup and network drivers.
# Omit NoNewPrivileges, RestrictNamespaces, LockPersonality, SystemCallFilter and MemoryDenyWriteExecute: seccomp/implied NNP or lost namespaces can break newuidmap/newgidmap and Podman; do not clear capabilities.
[Service]
# New private state and transient files need no group or world access; explicit shared modes remain authoritative.
UMask=0077
# No source path loads modules, accesses raw devices, sets host time, reads kernel logs or blocks suspend; retain UID/GID and container capabilities.
CapabilityBoundingSet=~CAP_SYS_MODULE CAP_SYS_RAWIO CAP_SYS_TIME CAP_SYSLOG CAP_WAKE_ALARM
# END ops/buzz-relay/aukora-buzz-watch.service

# BEGIN ops/buzz-relay/aukora-buzz-watch.timer
# Timer only: schedules aukora-buzz-watch.service; its process restrictions belong on the service.
[Timer]
# END ops/buzz-relay/aukora-buzz-watch.timer
